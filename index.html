<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Govee Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div>
          <p class="eyebrow">Govee Control</p>
          <h1>Minimal control for every Govee light you own.</h1>
          <p class="subtitle">
            Auto-connected on load. Manage power, brightness, and color from a
            clean dashboard.
          </p>
        </div>
        <div class="header__status" id="statusNotice">Not connected.</div>
      </header>

      <main class="app__main">
        <section class="panel panel--devices">
          <div class="panel__head">
            <div>
              <p class="eyebrow">Devices</p>
              <h2>All Lights</h2>
              <p class="muted" id="deviceCount">0 devices</p>
            </div>
            <div class="panel__actions">
              <button id="refreshBtn">Refresh</button>
              <button id="allOffBtn" class="ghost">All Off</button>
            </div>
          </div>

          <div class="device-groups" id="deviceGroups"></div>
        </section>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
